<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="FoodLens helps shoppers understand packaged product labels before they buy.">
    <title>{% block title %}FoodLens | Scan. Understand. Buy Better.{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header class="site-header">
        <div class="shell nav-row">
            <a class="brand" href="{{ url_for('main.index') }}" aria-label="FoodLens home">
                <span class="brand-mark" aria-hidden="true">⌗</span>
                <span>Food<span class="brand-accent">Lens</span></span>
            </a>
            <button class="menu-toggle" id="menuToggle" type="button" aria-label="Open navigation" aria-expanded="false">☰</button>
            <nav class="primary-nav" id="primaryNav" aria-label="Primary navigation">
                <a class="{% if request.endpoint == 'main.index' %}active{% endif %}" href="{{ url_for('main.index') }}">Home</a>
                <a class="{% if request.endpoint == 'scan.scan_page' %}active{% endif %}" href="{{ url_for('scan.scan_page') }}">Scan Product</a>
                <a href="{{ url_for('main.index') }}#compare">Compare</a>
                <a href="{{ url_for('main.about') }}">About</a>
                <a class="seller-link" href="{{ url_for('scan.scan_page') }}">For Sellers</a>
            </nav>
        </div>
    </header>

    <main>{% block content %}{% endblock %}</main>

    <footer class="site-footer">
        <div class="shell footer-row">
            <span>© 2026 FoodLens · A label-transparency prototype</span>
            <span>Built for the Smart India Hackathon</span>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
